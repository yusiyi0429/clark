<svg xmlns="http://www.w3.org/2000/svg" viewBox="72 72 368 368" role="img" aria-labelledby="title desc">
  <title id="title">天枢 TKOS 流光枢纽标志</title>
  <desc id="desc">三条圆润的渐变光带穿过同一个中央枢纽，形成六向星光。</desc>

  <defs>
    <!--
      只画一枚光梭，再绕枢心复用六次。内端靠近圆心、外端略向顺时针弯，
      六枚自然围出中央负形，不需要描边、折面或遮罩。
    -->
    <path id="flow-ray" d="M305 247C339 239 371 222 404 204"/>
    <linearGradient id="ray-flow" x1="305" y1="247" x2="404" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#075CCB"/>
      <stop offset=".52" stop-color="#1684FF"/>
      <stop offset="1" stop-color="#5BD8F6"/>
    </linearGradient>
  </defs>

  <g
    fill="none"
    stroke="url(#ray-flow)"
    stroke-linecap="round"
    stroke-width="48"
  >
    <use href="#flow-ray"/>
    <use href="#flow-ray" transform="rotate(60 256 256)"/>
    <use href="#flow-ray" transform="rotate(120 256 256)"/>
    <use href="#flow-ray" transform="rotate(180 256 256)"/>
    <use href="#flow-ray" transform="rotate(240 256 256)"/>
    <use href="#flow-ray" transform="rotate(300 256 256)"/>
  </g>
</svg>
