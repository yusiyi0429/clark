# 只跑确定性检查（.tech/07 §12）：本地 stub Provider、一次性测试 PostgreSQL，无付费模型/Search/备份恢复。
name: CI

on:
  push:
  pull_request:

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract, domain, API, Pi/MCP and Web tests
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
      - name: OpenAPI generated Web client is clean
        run: |
          pnpm --filter @warmap/web gen:client
          git diff --exit-code -- apps/web/src/lib/api
