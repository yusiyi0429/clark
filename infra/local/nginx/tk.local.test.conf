# 本地替身：对应火山宿主机 Nginx（infra/host-nginx/tk.tokenkingos.com.conf），终止 TLS 后整域名转给 edge。
# 证书由 up.sh 用 mkcert 生成到 infra/local/certs/（不入库）。
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/local.pem;
    ssl_certificate_key /etc/nginx/certs/local-key.pem;

    client_max_body_size 120m;

    location / {
        proxy_pass http://edge:80;
        proxy_http_version 1.1;
        # 线上是 $host；本地可能用非 443 端口，用 $http_host 保留端口，443 时两者相同
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
