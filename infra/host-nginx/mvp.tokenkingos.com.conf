# 火山宿主机 Nginx（方案 B）：终止 mvp.tokenkingos.com 的 TLS，整个域名转给天枢 edge（127.0.0.1:3130），不按路径拆。
# 替换宿主机 /etc/nginx/sites-available/mvp.conf 后 `nginx -t && systemctl reload nginx`（步骤与回退见 infra/staging/runbook.md §0）。
server {
    listen 80;
    listen [::]:80;
    server_name mvp.tokenkingos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mvp.tokenkingos.com;

    ssl_certificate     /etc/letsencrypt/live/mvp.tokenkingos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mvp.tokenkingos.com/privkey.pem;

    # 最大单次请求是会前材料/会话附件整批上传（API bodyLimit 101MB）
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3130;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 对话走 SSE 逐字推送；上传直接流给后端
        proxy_buffering off;
        proxy_request_buffering off;
        # 流式对话、预研与录音转写会长时间占着连接
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
