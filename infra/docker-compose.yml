# CEO WarMap 单机 Compose（.tech/08）。
# 火山方案 B：宿主机 Nginx 终止 TLS，edge 只绑 127.0.0.1:3130；web/api/postgres/wechat 仅内网。
# 长期服务 restart: unless-stopped，崩溃或宿主机重启后由 Docker 拉起；共享主机（15G、无 swap）上按容器设内存上限，合计约 3G。
# migration 由 API 启动前内联执行（apps/api/src/migrate.ts：advisory lock、只向前、失败不 listen），
# 不存在自动 down/rollback；回滚依赖部署前备份（infra/backup）与旧镜像。
name: warmap

services:
  postgres:
    restart: unless-stopped
    mem_limit: 768m
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: warmap
      POSTGRES_USER: warmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warmap -d warmap"]
      interval: 5s
      timeout: 3s
      retries: 12

  # 材料/附件/录音命名卷属主初始化：Docker 新建命名卷为 root:root，而 API 以 uid 1000 运行，
  # 不初始化则首次上传 EACCES。复用栈内已有的 postgres 镜像（自带 sh/chown），以 root 一次性
  # chown 三个卷后退出；API 用 service_completed_successfully 等它结束，自身仍以非 root 运行。
  storage-init:
    image: postgres:17-alpine
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - mkdir -p /var/lib/warmap/meeting_materials /var/lib/warmap/conversation_attachments /var/lib/warmap/meeting_recordings && chown -R 1000:1000 /var/lib/warmap/meeting_materials /var/lib/warmap/conversation_attachments /var/lib/warmap/meeting_recordings
    volumes:
      - meeting_materials:/var/lib/warmap/meeting_materials
      - conversation_attachments:/var/lib/warmap/conversation_attachments
      - meeting_recordings:/var/lib/warmap/meeting_recordings

  # 公众号账号级来源的独立 AGPL sidecar：官方镜像、不 vendor 源码、无 ports（不经 Caddy）。
  # WarMap API 只经内网 MCP 调用它并持静态 Token；微信 Cookie 只存在 sidecar 的 wechat_data 卷。
  wechat:
    restart: unless-stopped
    mem_limit: 384m
    # AGPL sidecar：钉 tag + digest，避免 tag 重推静默换代码（供应链接口与来源可审计）
    image: tmwgsicp/wechat-download-api:1.7.0@sha256:4723fcbbda1e4c28edb605760fade4e5815636a087d25bf0dfa7ddd397e82c3a
    environment:
      TZ: Asia/Shanghai
      ENABLE_MCP: "1"
      MCP_TOKEN: ${WECHAT_MCP_TOKEN:-}
      # DNS-rebinding 白名单必须包含 API 访问用的 Host（wechat:5000），否则 MCP 拒绝内网调用
      MCP_RESOURCE_URL: http://wechat:5000/mcp
      SITE_URL: ${WECHAT_SITE_URL:-http://localhost:5000}
      # MVP 不配代理池：关闭正文抓取，只取已抓取的文章元数据，降低账号风控风险
      RSS_FETCH_FULL_CONTENT: "false"
      # 可选 SOCKS5 代理池（逗号分隔），降低微信风控；留空则直连
      PROXY_URLS: ${WECHAT_PROXY_URLS:-}
    # Linux 上让 sidecar 能访问宿主机代理（macOS/Windows Docker Desktop 自带）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - wechat_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api:
    restart: unless-stopped
    mem_limit: 1280m
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    environment:
      DATABASE_URL: postgres://warmap:${POSTGRES_PASSWORD}@postgres:5432/warmap
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?PUBLIC_DOMAIN required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-2592000}
      EXTRA_ALLOWED_ORIGINS: ${EXTRA_ALLOWED_ORIGINS:-}
      DRI_SERVICE_TOKEN: ${DRI_SERVICE_TOKEN:?DRI_SERVICE_TOKEN required}
      ONTOLOGY_SERVICE_TOKEN: ${ONTOLOGY_SERVICE_TOKEN:-}
      TKOS_WORLD_API_URL: ${TKOS_WORLD_API_URL:-}
      TKOS_WORLD_AGENT_TOKEN: ${TKOS_WORLD_AGENT_TOKEN:-}
      COMPANY_MEMORY_MCP_TOKEN: ${COMPANY_MEMORY_MCP_TOKEN:?COMPANY_MEMORY_MCP_TOKEN required}
      # 单一来源：seed/memory/ CompanyMemory Markdown 目录 + 真实人员名单，均只读挂载；生产可换 host 路径并同步覆盖
      COMPANY_MEMORY_SEED_DIR: /repo/seed/memory
      COMPANY_PEOPLE_SEED: /repo/seed/company-people.json
      MISSION_CARD_DRAFTS_DIR: ${MISSION_CARD_DRAFTS_DIR:-/repo/seed/placeholders}
      MISSION_CARD_KNOWN_MISSIONS_FILE: ${MISSION_CARD_KNOWN_MISSIONS_FILE:-/repo/seed/imports/2026-10-known-missions.json}
      COMPANY_NAME: ${COMPANY_NAME:-}
      PI_BASE_URL: ${PI_BASE_URL:?PI_BASE_URL required}
      PI_API_KEY: ${PI_API_KEY:?PI_API_KEY required}
      LIGHT_MODEL: ${LIGHT_MODEL:?LIGHT_MODEL required}
      HEAVY_MODEL: ${HEAVY_MODEL:?HEAVY_MODEL required}
      COMPACTION_MODEL: ${COMPACTION_MODEL:?COMPACTION_MODEL required}
      # Radar Provider 可选：缺失时 Radar Card 如实显示未配置。
      # 唯一 Web Search Provider 为博查；公众号只经内网 MCP sidecar，账号级、非关键词替代。
      BOCHA_API_KEY: ${BOCHA_API_KEY:-}
      WECHAT_MCP_URL: ${WECHAT_MCP_URL:-http://wechat:5000/mcp}
      WECHAT_MCP_TOKEN: ${WECHAT_MCP_TOKEN:-}
      TOS_ACCESS_KEY: ${TOS_ACCESS_KEY:-}
      TOS_SECRET_KEY: ${TOS_SECRET_KEY:-}
      TOS_ENDPOINT: ${TOS_ENDPOINT:-}
      TOS_REGION: ${TOS_REGION:-}
      TOS_BUCKET: ${TOS_BUCKET:-}
      VOLC_ASR_API_KEY: ${VOLC_ASR_API_KEY:-}
      VOLC_ASR_APP_KEY: ${VOLC_ASR_APP_KEY:-}
      VOLC_ASR_ACCESS_KEY: ${VOLC_ASR_ACCESS_KEY:-}
      VOLC_ASR_RESOURCE_ID: ${VOLC_ASR_RESOURCE_ID:-}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENT_ASR_REGION: ${TENCENT_ASR_REGION:-}
      TENCENT_VOICEPRINT_GROUP: ${TENCENT_VOICEPRINT_GROUP:-}
      TENCENT_ASR_APP_ID: ${TENCENT_ASR_APP_ID:-}
      TENCENT_ASR_ENGINE: ${TENCENT_ASR_ENGINE:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      DICTATION_POLISH_MODEL: ${DICTATION_POLISH_MODEL:-}
      DICTATION_POLISH_BACKUP_MODEL: ${DICTATION_POLISH_BACKUP_MODEL:-}
      DICTATION_POLISH_TIMEOUT_MS: ${DICTATION_POLISH_TIMEOUT_MS:-}
      FFMPEG_PATH: ${FFMPEG_PATH:-}
      BUILD_SHA: ${BUILD_SHA:-dev}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-warmap}
      MEETING_MATERIAL_STORAGE_DIR: /var/lib/warmap/meeting_materials
      CONVERSATION_ATTACHMENT_STORAGE_DIR: /var/lib/warmap/conversation_attachments
      MEETING_RECORDING_STORAGE_DIR: /var/lib/warmap/meeting_recordings
    volumes:
      - meeting_materials:/var/lib/warmap/meeting_materials
      - conversation_attachments:/var/lib/warmap/conversation_attachments
      - meeting_recordings:/var/lib/warmap/meeting_recordings
      - ../seed:/repo/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      wechat:
        condition: service_started

  web:
    restart: unless-stopped
    mem_limit: 512m
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    environment:
      API_SERVER_URL: http://api:4000
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN}
    depends_on:
      - api

  edge:
    restart: unless-stopped
    mem_limit: 128m
    image: caddy:2
    # 只绑宿主机回环：公网 80/443 归宿主机 Nginx（终止 TLS 后整域名转发到这里）
    ports:
      - "127.0.0.1:3130:80"
    volumes:
      - ../infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  pgdata:
  meeting_materials:
  conversation_attachments:
  meeting_recordings:
  wechat_data:
  caddy_data:
  caddy_config:
